<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://yxygwwoocsdnneqykiym.supabase.co; object-src 'none'; base-uri 'none'; form-action 'none'; navigate-to 'self' https://buy.stripe.com https://*.stripe.com">
<title>Sichere Zahlung wird geöffnet – TALENTEXPERTE</title>
<style>
html,body{height:100%;margin:0;background:#0b0b0b;color:#fff;font-family:Arial,sans-serif}main{min-height:100%;display:grid;place-items:center;padding:24px;box-sizing:border-box;text-align:center}.box{max-width:520px}.mark{width:42px;height:42px;margin:0 auto 18px;border:4px solid rgba(255,255,255,.15);border-top-color:#e50000;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}h1{font-size:1.35rem;margin:0 0 10px}p{color:#aaa;line-height:1.5}a{display:inline-block;margin-top:12px;padding:12px 20px;border-radius:999px;background:#e50000;color:#fff;text-decoration:none;font-weight:700}a[hidden]{display:none}
</style>
</head>
<body>
<main><div class="box"><div class="mark" aria-hidden="true"></div><h1 id="title">Zahlungsstatus wird geprüft</h1><p id="message">Wir prüfen kurz, ob der Camp-Platz noch zur Zahlung freigegeben ist. Anschließend wirst du sicher zu Stripe weitergeleitet.</p><a id="continueLink" href="#" rel="noreferrer" hidden>Weiter zu Stripe</a></div></main>
<script>
(async function(){
  var SUPABASE_URL='https://yxygwwoocsdnneqykiym.supabase.co';
  var params=new URLSearchParams(location.hash.replace(/^#/,''));
  var id=params.get('id')||'';
  var token=params.get('token')||'';
  var stripe=params.get('stripe')||'';
  var validId=/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(id);
  var target;
  try{target=new URL(stripe)}catch(e){target=null}
  var localTest=target&&target.protocol==='http:'&&(target.hostname==='127.0.0.1'||target.hostname==='localhost');
  var stripeHost=target&&target.protocol==='https:'&&(target.hostname==='buy.stripe.com'||target.hostname.endsWith('.stripe.com'));
  if(!validId||token.length<20||!target||(!stripeHost&&!localTest)){
    document.querySelector('.mark').style.display='none';
    document.getElementById('title').textContent='Zahlungslink nicht gültig';
    document.getElementById('message').innerHTML='Bitte öffne den Zahlungslink erneut aus deiner Anmeldung oder E-Mail. Bei Fragen: <a href="mailto:kontakt@talentexperte.de">kontakt@talentexperte.de</a>';
    history.replaceState(null,'',location.pathname);
    return;
  }
  try{
    sessionStorage.setItem('te_anmeldung_id',id);
    sessionStorage.setItem('te_confirmation_token',token);
  }catch(e){}
  history.replaceState(null,'',location.pathname);
  try{
    var response=await fetch(SUPABASE_URL+'/functions/v1/register',{
      method:'POST',cache:'no-store',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'get_confirmation',registration_id:id,confirmation_token:token})
    });
    var payload=await response.json();
    var registration=payload&&payload.registration;
    var paymentStatus=String(registration&&registration.parent_payment_status||'').toLowerCase();
    var legacyStatus=String(registration&&registration.zahlungsstatus||'').toLowerCase();
    var expiresAt=registration&&registration.reservation_expires_at?new Date(registration.reservation_expires_at).getTime():null;
    var active=response.ok&&payload.success&&registration&&registration.payer_type==='parent'&&paymentStatus==='open'&&legacyStatus==='offen'&&!registration.released_due_to_nonpayment_at&&(!expiresAt||expiresAt>Date.now());
    if(!active){
      document.querySelector('.mark').style.display='none';
      document.getElementById('title').textContent=paymentStatus==='paid'?'Zahlung bereits bestätigt':'Zahlung nicht mehr möglich';
      document.getElementById('message').innerHTML=paymentStatus==='paid'
        ? 'Die Zahlung ist bereits eingegangen. Der Camp-Platz ist verbindlich reserviert.'
        : 'Die Zahlungsfrist ist abgelaufen oder die Anmeldung ist nicht mehr aktiv. Bitte zahle nicht mehr über einen älteren Link. Bei Fragen: <a href="mailto:kontakt@talentexperte.de">kontakt@talentexperte.de</a>';
      return;
    }
  }catch(e){
    document.querySelector('.mark').style.display='none';
    document.getElementById('title').textContent='Zahlungsstatus nicht prüfbar';
    document.getElementById('message').innerHTML='Bitte versuche es später erneut. Bei Fragen: <a href="mailto:kontakt@talentexperte.de">kontakt@talentexperte.de</a>';
    return;
  }
  var continueLink=document.getElementById('continueLink');
  continueLink.href=target.href;
  continueLink.hidden=false;
  document.getElementById('title').textContent='Sichere Zahlung wird geöffnet';
  document.getElementById('message').textContent='Der Camp-Platz ist noch zur Zahlung freigegeben. Du wirst jetzt zu Stripe weitergeleitet.';
  setTimeout(function(){continueLink.click()},50);
})();
</script>
</body>
</html>
